name: Verify Docker Build

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --tag data-aggregator-api:latest

      - name: Run the Docker container
        run: docker run -d --name api-container -p 80:80 data-aggregator-api:latest

      - name: Wait for container to start
        run: sleep 10

      - name: Check container logs for errors
        run: docker logs api-container

      - name: Verify health check endpoint
        run: |
          curl -f http://localhost:80/health